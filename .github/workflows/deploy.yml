name: Deploy to Hostinger

# Every push to main builds the two React apps (frontend-user, frontend-dashboard), installs the CodeIgniter
# backend's dependencies and uploads everything to Hostinger over FTP. Only changed files are uploaded.
# .env, public/uploads/ (product photos) and the logs, sessions and cache in writable/ on the server are never touched.
#
# Server layout (three folders, three addresses):
#   public_html/          https://cityfloristhubli.com        the website (frontend-user build)
#   public_html/admin/    https://admin.cityfloristhubli.com  the dashboard (frontend-dashboard build)
#   public_html/api/      https://api.cityfloristhubli.com    CodeIgniter (backend/): .htaccess sends every request
#                                                             into public/; .env lives here; public/uploads/ = photos
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, and optionally FTP_SERVER_DIR (the public_html folder as the
# FTP account sees it, with a trailing slash; default "public_html/").

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The tests run against MariaDB, the MySQL server Hostinger uses (the app is MySQL-only).
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cityflorist_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend-user/package-lock.json
            frontend-dashboard/package-lock.json

      - name: Build website (frontend-user)
        working-directory: frontend-user
        run: |
          npm ci
          npm run build

      - name: Build dashboard (frontend-dashboard)
        working-directory: frontend-dashboard
        run: |
          npm ci
          npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, gd, mysqli, mbstring, curl
          coverage: none
          tools: composer:v2

      - name: Test backend
        working-directory: backend
        # CodeIgniter reads database.tests.<name> from these (BaseConfig: database_tests_<name>). A database.tests
        # line in .env would win over them, so the copied .env loses those lines; the tests use the
        # cityflorist_ci_test database.
        env:
          database_tests_hostname: 127.0.0.1
          database_tests_port: 3306
          database_tests_database: cityflorist_ci_test
          database_tests_username: root
          database_tests_password: root
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          sed -i '/^database\.tests\./d' .env
          php spark key:generate
          composer test

      - name: Install production dependencies
        working-directory: backend
        run: |
          rm .env
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Assemble the three folders
        run: |
          mkdir -p deploy/public_html deploy/admin deploy/api
          # Website → public_html/, dashboard → public_html/admin/ (each with its own .htaccess from public/)
          cp -r frontend-user/dist/. deploy/public_html/
          cp -r frontend-dashboard/dist/. deploy/admin/
          # Backend → public_html/api/
          cp -r backend/. deploy/api/
          cd deploy/api
          rm -rf tests build .env phpunit.xml phpunit.xml.dist .phpunit.result.cache public/uploads/*
          mv deploy/.htaccess .htaccess && rm -rf deploy
          # Empty runtime folders still have to exist on the server: CodeIgniter writes its cache, logs and
          # sessions there (and won't create writable/cache itself). Each keeps its index.html and a .keep file.
          for d in cache debugbar logs session uploads; do
            mkdir -p "writable/$d"
            find "writable/$d" -mindepth 1 -maxdepth 1 ! -name index.html -exec rm -rf {} +
            touch "writable/$d/.keep"
          done
          mkdir -p public/uploads && touch public/uploads/.keep
          cd ../..
          find deploy -maxdepth 2 -not -path 'deploy/api/vendor/*' | sort

      # The action only ever deletes files it uploaded itself (it keeps a .ftp-deploy-sync-state.json in each
      # folder), so the website upload never touches admin/ or api/, and files the server creates are safe.
      - name: Upload the API (api.cityfloristhubli.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}api/
          local-dir: ./deploy/api/
          # writable/ lines (logs, sessions, rate-limit counters, debug toolbar) are belt and braces. The writable/
          # folders themselves are deliberately not excluded, so their placeholders create the folders.
          exclude: |
            **/.git*
            **/.git*/**
            .env
            public/uploads/**
            writable/cache/ratelimit_*
            writable/debugbar/debugbar_*
            writable/logs/log-*
            writable/session/city_florist_session*

      - name: Upload the dashboard (admin.cityfloristhubli.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}admin/
          local-dir: ./deploy/admin/

      - name: Upload the website (cityfloristhubli.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./deploy/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            admin/**
            api/**
